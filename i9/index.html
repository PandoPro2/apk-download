    <style>
      html.is-promo-boot,
      html.is-promo-boot body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #app-boot {
        display: none;
      }
      html.is-promo-boot #app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        font-family: "IBM Plex Sans SC", "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
        color: #111;
        opacity: 1;
        transition: opacity .32s ease;
      }
      #app-boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(220px, calc(100vw - 48px));
      }
      .boot-logo {
        width: 84px;
        height: 84px;
        margin-bottom: 18px;
        animation: boot-logo-float 2.4s ease-in-out infinite;
      }
      .boot-logo svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .boot-eye {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-blink 4.6s ease-in-out infinite;
      }
      .boot-name {
        margin: 0 0 36px;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: .04em;
        line-height: 1;
        color: #111;
      }
      .boot-bar {
        width: 168px;
        max-width: 100%;
        height: 4px;
        overflow: hidden;
        background: #e4e4e0;
        border-radius: 999px;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #111;
        border-radius: inherit;
      }
      .boot-pct {
        margin: 12px 0 0;
        min-width: 4.6em;
        font-size: 22px;
        font-weight: 400;
        font-style: italic;
        letter-spacing: .06em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: center;
        color: rgba(17, 17, 17, .42);
      }
      @keyframes boot-logo-float {
        0%, 100% { transform: translateY(4px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes boot-blink {
        0%, 78%, 100% { transform: scaleY(1); }
        84%, 90% { transform: scaleY(0.12); }
      }
      #app-boot.is-done .boot-logo,
      #app-boot.is-done .boot-eye { animation: none; }
      @media (prefers-reduced-motion: reduce) {
        #app-boot,
        .boot-bar i { transition: none; }
        .boot-logo,
        .boot-eye { animation: none; }
      }
